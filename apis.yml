name: Innovium
description: 'Innovium, Inc. was a Santa Clara, California semiconductor company founded in 2014 that
  designed high-bandwidth Ethernet switch silicon (the TERALYNX family) for cloud and enterprise data
  centers, competing with Broadcom on high-radix, low-latency switching with deep buffers and built-in
  telemetry/analytics. Backed by Greylock and other deep-tech investors, Innovium was acquired by Marvell
  Technology in 2021 (~$1.1B) and its switching technology continues inside Marvell''s portfolio. The
  company shipped hardware silicon, not a public developer API — innovium.com now redirects to
  marvell.com, and there is no developer portal, OpenAPI, or programmatic API surface to enrich.'
